<style>
/* Layout: season-summary strip on top, then a single chronological match list; tap a match to open its score card in place. */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --ink:#151d33; --muted:#5f6a85; --line:#d9dfec;
  --pitch:#1c3f9e; --pitch-ink:#ffffff; --chalk:#e7ecf7;
  --win:#1f7a44; --draw:#9a7a12; --loss:#b23a32; --pending:#7a6f60;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1320; --surface:#171d2e; --ink:#e7ebf5; --muted:#98a2bd; --line:#283149;
  --pitch:#3a63d6; --pitch-ink:#ffffff; --chalk:#1b2338;
  --win:#4cc27a; --draw:#e0bd4e; --loss:#ef7a70; --pending:#b3a998; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1320; --surface:#171d2e; --ink:#e7ebf5; --muted:#98a2bd; --line:#283149;
  --pitch:#3a63d6; --pitch-ink:#ffffff; --chalk:#1b2338;
  --win:#4cc27a; --draw:#e0bd4e; --loss:#ef7a70; --pending:#b3a998; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
header.hero{background:var(--pitch);color:var(--pitch-ink);border-radius:18px;padding:20px 18px 18px;position:relative;overflow:hidden}
header.hero::after{content:"";position:absolute;inset:auto -60px -60px auto;width:180px;height:180px;border:2px solid rgba(255,255,255,.22);border-radius:50%}
header.hero::before{content:"";position:absolute;top:0;bottom:0;left:38%;border-left:2px solid rgba(255,255,255,.14)}
.eyebrow{font-size:16px;font-weight:600;letter-spacing:.03em;opacity:.92}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,38px);margin:2px 0 14px;text-wrap:balance;position:relative}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}
.stat{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;opacity:.9}
.sync{position:relative;margin-top:10px;font-size:12px;opacity:.8}
section h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 10px}
.scorers{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.scorers ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.scorers li{display:flex;align-items:center;gap:10px}
.scorers .rank{width:22px;color:var(--muted);font-variant-numeric:tabular-nums}
.scorers .nm{flex:1;min-width:0;font-weight:600}
.scorers .g{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:18px}
.empty{color:var(--muted);font-size:14px}
.roster{list-style:none;margin:0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 14px}
.roster li{display:flex;align-items:center;gap:8px;min-width:0}
.roster .no{flex:none;width:30px;height:26px;display:grid;place-items:center;border-radius:8px;background:var(--chalk);color:var(--pitch);font-family:var(--display);font-variant-numeric:tabular-nums}
.roster em{font-style:normal;font-size:11px;font-weight:700;color:var(--pitch);border:1px solid var(--pitch);border-radius:99px;padding:0 6px}
.month{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.03em;margin:14px 2px 6px}
.games{display:flex;flex-direction:column}
.game{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.game.next{border-color:var(--pitch);box-shadow:0 0 0 2px color-mix(in srgb,var(--pitch) 30%,transparent)}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;width:100%;padding:12px;cursor:pointer;border-radius:14px}
.row:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.rd{text-align:center;line-height:1.1}
.rd b{display:block;font-family:var(--display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
.rd span{font-size:11px;color:var(--muted)}
.mid{min-width:0}
.opp{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.ha{font-weight:700}
.res{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.score{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;color:var(--surface);white-space:nowrap}
.chip.W{background:var(--win)}.chip.D{background:var(--draw)}.chip.L{background:var(--loss)}
.chip.P{background:transparent;color:var(--pending);border:1px dashed var(--pending)}
.chip.N{background:var(--pitch)}
.sc-line{font-size:13px;color:var(--muted);padding:0 12px 10px 12px;margin-top:-4px}
.edit{border-top:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:14px;background:var(--chalk);border-radius:0 0 14px 14px}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.team label{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.team.us label{color:var(--pitch)}
.num{width:64px;height:56px;text-align:center;font-family:var(--display);font-size:28px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.num:focus-visible,.txt:focus-visible{outline:2px solid var(--pitch);outline-offset:1px}
.dash{font-family:var(--display);font-size:24px;color:var(--muted)}
.slist{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;gap:8px;align-items:center}
.txt{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;background:var(--surface);color:var(--ink)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.step button{all:unset;width:34px;height:40px;text-align:center;cursor:pointer;font-size:20px;color:var(--pitch)}
.step button:focus-visible{outline:2px solid var(--pitch)}
.step output{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.x{all:unset;cursor:pointer;color:var(--muted);font-size:20px;padding:0 6px}
.hint{font-size:12px;color:var(--muted)}
.hint.warn{color:var(--loss)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--pitch);color:var(--pitch-ink);border-color:var(--pitch)}
.btn.ghost{background:transparent}
.btn:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.btn:disabled{opacity:.6;cursor:default}
.slabel{font-size:13px;font-weight:700}
@media (max-width:420px){.stat b{font-size:20px}.num{width:56px;height:50px;font-size:24px}}
@media (prefers-reduced-motion:no-preference){.edit{animation:open .18s ease-out}@keyframes open{from{opacity:.4;transform:translateY(-4px)}to{opacity:1;transform:none}}}
</style>

<style>
.comp{font-size:11px;font-weight:700;padding:0 7px;border-radius:99px;border:1px solid var(--draw);color:var(--draw)}
.rd .cup{font-size:18px;line-height:1.2;color:var(--draw);font-family:var(--display)}
.rd .cupn{color:var(--draw)}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.ghead h2{margin:0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{font:inherit;font-size:13px;font-weight:700;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fbtn:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.addcup{background:var(--surface);border:1px dashed var(--draw);border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;gap:10px;margin:10px 0}
.addcup .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addcup .grid > *{min-width:0}
.addcup label{font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:4px}
.addcup select,.addcup input{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;background:var(--bg);color:var(--ink);width:100%}
.addcup .full{grid-column:1/-1}
.row.ro{cursor:default}
.sqhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sqbtns{display:flex;gap:12px}
.lnk{all:unset;cursor:pointer;font-size:13px;font-weight:700;color:var(--pitch)}
.lnk:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px 6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.pchip b{font-family:var(--display);font-weight:400;font-variant-numeric:tabular-nums;color:var(--pitch)}
.pchip[aria-pressed="true"]{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink)}
.pchip[aria-pressed="true"] b{color:var(--pitch-ink)}
.pchip:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.roster .rn{flex:1;min-width:0}
.roster .apps{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.caprow{display:flex;flex-direction:column;gap:6px}
.caprow select{max-width:320px}
.sponsor{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px 6px;text-decoration:none}
.sponsor img{width:100%;max-width:320px;height:auto;display:block}
.sp-label{font-size:12px;font-weight:700;letter-spacing:.06em;color:#5f6a85}
.sponsor:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.duo,.stat b.duo{display:flex;direction:rtl;gap:3px;justify-content:center}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;margin:2px 0 14px}
.titlerow h1{margin:0}
.crest{width:76px;height:76px;border-radius:50%;background:#fff;padding:6px;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.25);object-fit:contain}
@media (max-width:420px){.crest{width:60px;height:60px}}
.edit.view .pchip{cursor:default}
.vres{display:flex;align-items:center;gap:10px}
.vsc{line-height:1.8}
.when{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.when label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;min-width:0}
.when .txt{width:100%}
.comp.moved{border-color:var(--loss);color:var(--loss)}
.live{background:var(--surface);border:2px solid var(--pitch);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.live.on{border-color:var(--loss)}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lbadge{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--chalk);color:var(--pitch)}
.lbadge.on{background:#b23a32;color:#fff}
.lbadge.ft{background:var(--ink);color:var(--surface)}
.lmeta{font-size:13px;color:var(--muted)}
.lboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.lteam{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:700;font-size:14px;min-width:0;overflow-wrap:anywhere}
.lcrest{width:52px;height:52px;border-radius:50%;background:#fff;object-fit:contain;padding:4px;border:1px solid var(--line)}
.lcrest.op{display:grid;place-items:center;background:var(--chalk);color:var(--muted);font-family:var(--display);font-size:24px;padding:0}
.lmid{display:flex;flex-direction:column;align-items:center;gap:6px}
.lscore{display:flex;direction:rtl;gap:8px;font-family:var(--display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.lscore span:nth-child(2){color:var(--muted)}
.lscore.vs{font-size:22px;color:var(--muted)}
.lclock{display:flex;flex-direction:column;align-items:center;gap:2px}
.lclock b{font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums;direction:ltr}
.lclock span{font-size:12px;color:var(--muted);text-align:center}
.ltl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ltl li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--chalk)}
.ltl li.them{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.ltl li.sep{background:none;justify-content:center;font-size:12px;color:var(--muted);font-weight:700;padding:2px}
.ltl .lmin{min-width:48px;font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--pitch);direction:ltr;text-align:center}
.ltl .lwho{flex:1;min-width:0;overflow-wrap:anywhere}
.lctrl{display:flex;gap:8px;flex-wrap:wrap}
.lctrl .btn{flex:1 1 auto}
.btn.goal{background:#1f7a44;border-color:#1f7a44;color:#fff}
.btn.stop{background:#b23a32;border-color:#b23a32;color:#fff}
.lpick{display:flex;flex-direction:column;gap:10px;background:var(--chalk);border-radius:12px;padding:12px}
.lminrow{display:flex;align-items:center;gap:10px}
.lminrow .txt{max-width:100px;flex:none}
.chip.live{background:var(--loss)}
.pchip .gl{font-size:12px}
@media (prefers-reduced-motion:no-preference){.lbadge.on{animation:lpulse 1.6s ease-in-out infinite}@keyframes lpulse{50%{opacity:.55}}}
html[lang="ar"]{--display:"Reem Kufi","Cairo",system-ui,sans-serif;--body:"Cairo",system-ui,sans-serif}
.langbtn{position:absolute;top:14px;left:14px;z-index:2;font:inherit;font-size:14px;font-weight:700;padding:5px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
.langbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.eyebrow{padding-left:76px;position:relative}
.waze{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--pitch);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:var(--surface);align-self:flex-start}
.waze:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.lextra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.lextra .waze{align-self:center}
.btn.sm{padding:6px 12px;font-size:14px}
.vres{flex-wrap:wrap}
.roster li{display:block}
.roster .pl{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;cursor:pointer;padding:3px 2px;border-radius:8px}
.roster .pl:hover{background:var(--chalk)}
.roster .pl:focus-visible{outline:2px solid var(--pitch)}
.sctab tr.clk{cursor:pointer}
.sctab tr.clk:hover td{background:var(--chalk)}
button.pchip{font:inherit}
dialog#pdlg{border:none;border-radius:18px;padding:0;max-width:min(520px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog#pdlg::backdrop{background:rgba(10,15,30,.55)}
.pcard{padding:18px;display:flex;flex-direction:column;gap:14px;max-height:80vh;overflow:auto}
.phead{display:flex;align-items:center;gap:12px}
.phead h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.phead > div{flex:1;min-width:0}
.pno{width:52px;height:52px;border-radius:14px;background:var(--pitch);color:var(--pitch-ink);display:grid;place-items:center;font-family:var(--display);font-size:26px;flex:none}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:center 20%;flex:none;background:var(--chalk);border:1px solid var(--line)}
.pph{position:relative;flex:none}
.pph img{display:block;width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:center 20%;border:3px solid var(--pitch);background:var(--chalk)}
.pnb{position:absolute;bottom:-2px;inset-inline-start:-4px;min-width:28px;height:28px;padding:0 6px;box-sizing:border-box;border-radius:99px;background:var(--pitch);color:var(--pitch-ink);display:grid;place-items:center;font-family:var(--display);font-size:16px;border:2px solid var(--surface)}
.locrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 4px}
.locrow .hint{font-size:13px;color:var(--muted)}
.prole{font-size:12px;font-weight:700;color:var(--pitch);border:1px solid var(--pitch);border-radius:99px;padding:0 8px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pstats div{background:var(--chalk);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.pstats b{font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.pstats span{font-size:12px;color:var(--muted)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:10px;background:var(--chalk)}
.plist .pd{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.plist .po{font-weight:700;min-width:0;overflow-wrap:anywhere}
.plist .po small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.plist .pr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.plist .score{font-size:16px}
.pm{font-size:12px;color:var(--muted)}
#rosterNote{margin:6px 2px 0}
.sumline{font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.ghead{margin-top:6px}
.sctab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sctab th{font-size:12px;color:var(--muted);font-weight:700;text-align:center;padding:0 4px 6px}
.sctab th:nth-child(2){text-align:right}
.sctab td{padding:5px 4px;text-align:center;border-top:1px solid var(--line)}
.sctab td.nm{text-align:right;font-weight:600;overflow-wrap:anywhere}
.sctab td.rank{color:var(--muted);width:24px}
.sctab td.tot{font-family:var(--display);font-size:18px}
.auth{position:relative;margin-top:8px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;opacity:.95}

.auth{z-index:1}
.auth .lnk{color:var(--pitch);background:var(--pitch-ink);text-decoration:none;padding:7px 14px;border-radius:99px;font-size:14px}
.auth span{opacity:.9}
.stats-note{position:relative;font-size:12px;opacity:.8;margin-top:6px}
</style>

function lineupChips(x){

// ===== Live match =====
const HALF=40, BREAK=10;
const isLive=x=>!!(x&&x.live&&["pre","1H","HT","2H"].includes(x.live.st));
const inPlay=x=>!!(x&&x.live&&["1H","HT","2H"].includes(x.live.st));
let livePick=null, wakeLock=null;
function featuredGame(){
  const games=allGames(),tdy=today();
  const lv=games.find(g=>inPlay(results[g.key]))||games.find(g=>isLive(results[g.key]));if(lv)return lv;
  const ft=games.find(g=>{const x=results[g.key];return x&&x.live&&x.live.st==="FT"&&iso(g.date)===iso(tdy)});if(ft)return ft;
  return games.find(g=>g.date>=tdy&&!outcome(results[g.key]))||null;
}
function liveMinute(L,now=Date.now()){
  if(!L)return {h:1,min:1};
  if(L.st==="1H")return {h:1,min:Math.max(1,Math.floor((now-L.t1)/60000)+1)};
  if(L.st==="2H")return {h:2,min:HALF+Math.max(1,Math.floor((now-L.t2)/60000)+1)};
  if(L.st==="HT")return {h:1,min:HALF};
  if(L.st==="FT")return {h:2,min:2*HALF};
  return {h:1,min:1};
}
const minLabel=(h,m)=>{const cap=h===1?HALF:2*HALF;return m>cap?`${cap}+${m-cap}'`:`${m}'`};
const mmss=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`};
function clockText(L,now=Date.now()){
  if(!L||L.st==="pre")return null;
  if(L.st==="1H"){const el=now-L.t1;return {big:mmss(el),small:t("h1")+(el>HALF*60000?t("added"):"")}}
  if(L.st==="HT"){const left=BREAK*60000-(now-L.e1);return {big:mmss(left),small:left>0?t("brk"):t("brkOver")}}
  if(L.st==="2H"){const el=now-L.t2;return {big:mmss(HALF*60000+el),small:t("h2")+(el>HALF*60000?t("added"):"")}}
  return {big:t("ft"),small:t("ended")};
}
function derive(events){
  const us=events.filter(e=>e.side==="us").length,them=events.filter(e=>e.side==="them").length;
  const m={};events.filter(e=>e.side==="us"&&e.name).forEach(e=>{m[e.name]=(m[e.name]||0)+1});
  return {us,them,scorers:Object.entries(m).map(([name,goals])=>({name,goals}))};
}
const sortedEvents=x=>[...((x&&x.events)||[])].sort((a,b)=>(a.h-b.h)||(a.min-b.min)||((a.ts||0)-(b.ts||0)));
function timeline(x,g,withDel){
  const ev=sortedEvents(x);if(!ev.length)return "";
  let prevH=1,out="";
  for(const e of ev){
    if(e.h===2&&prevH===1)out+=`<li class="sep">${t("h2")}</li>`;prevH=e.h;
    out+=`<li class="${e.side}"><span class="lmin" dir="ltr">${minLabel(e.h,e.min)}</span><span class="lwho">⚽ ${e.side==="us"?esc(dispName(e.name)||t("unknownScorer")):esc(t("goalFor",oName(g.o)))}</span>${withDel?`<button class="x" data-evdel="${e.id}" aria-label="מחק את השער">×</button>`:""}</li>`;
  }
  return `<ol class="ltl">${out}</ol>`;
}
async function patchGame(k,patch){
  const base=results[k]?{...results[k]}:{round:+k.slice(1)};
  const rec={...base,...patch};
  if(patch.events)Object.assign(rec,derive(patch.events));
  for(const f in rec)if(rec[f]===undefined)delete rec[f];
  await writeDoc(k,rec);renderAll();
}
function keepAwake(on){

    if(!on&&wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}
  }catch(e){}
}

  if(a==="unlive"){await patchGame(k,{live:null});return}
  if(a==="ht"){await patchGame(k,{live:{...L,st:"HT",e1:now}});return}
  if(a==="k2"){await patchGame(k,{live:{...L,st:"2H",t2:now}});return}
  if(a==="ft"){if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="ללחוץ שוב לסיום";return}await patchGame(k,{live:{...L,st:"FT",e2:now}});return}
  if(a==="undo"){
    const back={"1H":"pre","HT":"1H","2H":"HT","FT":"2H"}[L.st];if(!back)return;
    const nl={...L,st:back};if(back==="pre"){delete nl.t1}if(back==="1H")delete nl.e1;if(back==="HT")delete nl.t2;if(back==="2H")delete nl.e2;
    const p={live:nl};if(back==="pre"&&!(x.events||[]).length){p.us=null;p.them=null}
    await patchGame(k,p);return}
  if(a==="gus"||a==="gthem"){const m=liveMinute(L);livePick={key:k,side:a==="gus"?"us":"them",no:null,min:m.min,h:m.h};renderLive();return}
  if(a==="lcancel"){livePick=null;renderLive();return}
  if(a==="lsave"&&livePick){
    const min=parseInt(document.getElementById("lmin").value,10);
    if(!(min>=1&&min<=120)){document.getElementById("lhint").textContent="צריך דקה בין 1 ל-120";return}
    if(livePick.side==="us"&&livePick.no==null){document.getElementById("lhint").textContent="בחר מי הבקיע";return}
    const p=livePick.no!=null?ROSTER.find(r=>r[0]===livePick.no):null;
    const h=L.st==="2H"||L.st==="FT"?2:1;
    const ev={id:now.toString(36)+Math.random().toString(36).slice(2,5),side:livePick.side,no:p?p[0]:null,name:p?`${p[1]} (${p[0]})`:"",min,h,ts:now};
    livePick=null;await patchGame(k,{events:[...(x.events||[]),ev]});return}
});
