<style>
/* Layout: season-summary strip on top, then a single chronological match list; tap a match to open its score card in place. */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --ink:#151d33; --muted:#5f6a85; --line:#d9dfec;
  --pitch:#1c3f9e; --pitch-ink:#ffffff; --chalk:#e7ecf7;
  --win:#1f7a44; --draw:#9a7a12; --loss:#b23a32; --pending:#7a6f60;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1320; --surface:#171d2e; --ink:#e7ebf5; --muted:#98a2bd; --line:#283149;
  --pitch:#3a63d6; --pitch-ink:#ffffff; --chalk:#1b2338;
  --win:#4cc27a; --draw:#e0bd4e; --loss:#ef7a70; --pending:#b3a998; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1320; --surface:#171d2e; --ink:#e7ebf5; --muted:#98a2bd; --line:#283149;
  --pitch:#3a63d6; --pitch-ink:#ffffff; --chalk:#1b2338;
  --win:#4cc27a; --draw:#e0bd4e; --loss:#ef7a70; --pending:#b3a998; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
header.hero{background:var(--pitch);color:var(--pitch-ink);border-radius:18px;padding:20px 18px 18px;position:relative;overflow:hidden}
header.hero::after{content:"";position:absolute;inset:auto -60px -60px auto;width:180px;height:180px;border:2px solid rgba(255,255,255,.22);border-radius:50%}
header.hero::before{content:"";position:absolute;top:0;bottom:0;left:38%;border-left:2px solid rgba(255,255,255,.14)}
.eyebrow{font-size:16px;font-weight:600;letter-spacing:.03em;opacity:.92}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,38px);margin:2px 0 14px;text-wrap:balance;position:relative}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}
.stat{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;opacity:.9}
.sync{position:relative;margin-top:10px;font-size:12px;opacity:.8}
section h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 10px}
.scorers{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.scorers ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.scorers li{display:flex;align-items:center;gap:10px}
.scorers .rank{width:22px;color:var(--muted);font-variant-numeric:tabular-nums}
.scorers .nm{flex:1;min-width:0;font-weight:600}
.scorers .g{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:18px}
.empty{color:var(--muted);font-size:14px}
.roster{list-style:none;margin:0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px 14px}
.roster li{display:flex;align-items:center;gap:8px;min-width:0}
.roster .no{flex:none;width:30px;height:26px;display:grid;place-items:center;border-radius:8px;background:var(--chalk);color:var(--pitch);font-family:var(--display);font-variant-numeric:tabular-nums}
.roster em{font-style:normal;font-size:11px;font-weight:700;color:var(--pitch);border:1px solid var(--pitch);border-radius:99px;padding:0 6px}
.month{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.03em;margin:14px 2px 6px}
.games{display:flex;flex-direction:column}
.game{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.game.next{border-color:var(--pitch);box-shadow:0 0 0 2px color-mix(in srgb,var(--pitch) 30%,transparent)}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;width:100%;padding:12px;cursor:pointer;border-radius:14px}
.row:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.rd{text-align:center;line-height:1.1}
.rd b{display:block;font-family:var(--display);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
.rd span{font-size:11px;color:var(--muted)}
.mid{min-width:0}
.opp{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.ha{font-weight:700}
.res{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.score{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;color:var(--surface);white-space:nowrap}
.chip.W{background:var(--win)}.chip.D{background:var(--draw)}.chip.L{background:var(--loss)}
.chip.P{background:transparent;color:var(--pending);border:1px dashed var(--pending)}
.chip.N{background:var(--pitch)}
.sc-line{font-size:13px;color:var(--muted);padding:0 12px 10px 12px;margin-top:-4px}
.edit{border-top:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:14px;background:var(--chalk);border-radius:0 0 14px 14px}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.team label{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.team.us label{color:var(--pitch)}
.num{width:64px;height:56px;text-align:center;font-family:var(--display);font-size:28px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.num:focus-visible,.txt:focus-visible{outline:2px solid var(--pitch);outline-offset:1px}
.dash{font-family:var(--display);font-size:24px;color:var(--muted)}
.slist{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;gap:8px;align-items:center}
.txt{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;background:var(--surface);color:var(--ink)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.step button{all:unset;width:34px;height:40px;text-align:center;cursor:pointer;font-size:20px;color:var(--pitch)}
.step button:focus-visible{outline:2px solid var(--pitch)}
.step output{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.x{all:unset;cursor:pointer;color:var(--muted);font-size:20px;padding:0 6px}
.hint{font-size:12px;color:var(--muted)}
.hint.warn{color:var(--loss)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--pitch);color:var(--pitch-ink);border-color:var(--pitch)}
.btn.ghost{background:transparent}
.btn:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.btn:disabled{opacity:.6;cursor:default}
.slabel{font-size:13px;font-weight:700}
@media (max-width:420px){.stat b{font-size:20px}.num{width:56px;height:50px;font-size:24px}}
@media (prefers-reduced-motion:no-preference){.edit{animation:open .18s ease-out}@keyframes open{from{opacity:.4;transform:translateY(-4px)}to{opacity:1;transform:none}}}
</style>

<style>
.comp{font-size:11px;font-weight:700;padding:0 7px;border-radius:99px;border:1px solid var(--draw);color:var(--draw)}
.rd .cup{font-size:18px;line-height:1.2;color:var(--draw);font-family:var(--display)}

.crest{width:76px;height:76px;border-radius:50%;background:#fff;padding:6px;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.25);object-fit:contain}

dialog#gdlg::backdrop{background:rgba(0,0,0,.88)}
.gbox{display:flex;flex-direction:column;align-items:center;gap:12px}
.gbox img{max-width:96vw;max-height:80vh;border-radius:8px;display:block;background:#000}
.gnav{display:flex;gap:10px;align-items:center;color:#fff;font-weight:700}
html.native #installBar,html.native #auth,html.native #icsAll{display:none!important}
.annl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ann{background:var(--chalk);border-radius:12px;padding:10px 14px;border-inline-start:4px solid var(--pitch)}
.annt{font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.annd{font-size:12px;color:var(--muted);margin-top:4px}
.annl.old .ann{border-inline-start-color:var(--line);opacity:.85}
.annmore{margin-top:8px;font-size:13px}
.anned{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.anned textarea{height:auto;padding:8px 10px;resize:vertical}
.anned .actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.trweek{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.trl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.trl li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--line);border-radius:12px}
.trl li>span:first-child{flex:1;min-width:0}
.trl li.nx{border-color:var(--pitch);border-width:2px}
.trl li.cx>span:first-child{text-decoration:line-through;color:var(--muted)}
.tradd{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tradd .txt{flex:1 1 120px}
.prefs{display:flex;flex-wrap:wrap;gap:6px}
.netbar{position:sticky;top:0;z-index:5;background:#b23a32;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px 10px}
.netbar[hidden]{display:none}
.prole{font-size:12px;font-weight:700;color:var(--pitch);border:1px solid var(--pitch);border-radius:99px;padding:0 8px}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ltl .ast{color:var(--muted);font-weight:400}
.pstats div{background:var(--chalk);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.pstats b{font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.pstats span{font-size:12px;color:var(--muted)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:10px;background:var(--chalk)}
.plist .pd{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.plist .po{font-weight:700;min-width:0;overflow-wrap:anywhere}
.plist .po small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.plist .pr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.plist .score{font-size:16px}
.pm{font-size:12px;color:var(--muted)}
#rosterNote{margin:6px 2px 0}
.sumline{font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.ghead{margin-top:6px}
.sctab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sctab th{font-size:12px;color:var(--muted);font-weight:700;text-align:center;padding:0 4px 6px}
.sctab th:nth-child(2){text-align:right}
.sctab td{padding:5px 4px;text-align:center;border-top:1px solid var(--line)}
.sctab td.nm{text-align:right;font-weight:600;overflow-wrap:anywhere}
.sctab td.rank{color:var(--muted);width:24px}
.sctab td.tot{font-family:var(--display);font-size:18px}
.auth{position:relative;margin-top:8px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;opacity:.95}
header.hero::before,header.hero::after{pointer-events:none}
.auth{z-index:1}
.auth .lnk{color:var(--pitch);background:var(--pitch-ink);text-decoration:none;padding:7px 14px;border-radius:99px;font-size:14px}
.auth span{opacity:.9}
.stats-note{position:relative;font-size:12px;opacity:.8;margin-top:6px}
.teampick{position:relative;z-index:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding-inline-end:70px}
.teampick::-webkit-scrollbar{display:none}
.teampick[hidden]{display:none}
.slabel.sub{font-size:12px;opacity:.8;margin-top:6px}
.ltl li.xev .xout{opacity:.7}
.teampick a{flex:none;color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.35);white-space:nowrap}
.teampick a[aria-current="true"]{background:#fff;color:var(--pitch)}
html.nonums .pl .no,html.nonums .pchip b,html.nonums .pnb,html.nonums .pno{display:none}
.tfollow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
</style>

const HALF=40, BREAK=10;
const isLive=x=>!!(x&&x.live&&["pre","1H","HT","2H"].includes(x.live.st));
const inPlay=x=>!!(x&&x.live&&["1H","HT","2H"].includes(x.live.st));

function featuredGame(){
  const games=allGames(),tdy=today();
  const lv=games.find(g=>inPlay(results[g.key]))||games.find(g=>isLive(results[g.key]));if(lv)return lv;
  const ft=games.find(g=>{const x=results[g.key];return x&&x.live&&x.live.st==="FT"&&iso(g.date)===iso(tdy)});if(ft)return ft;
  return games.find(g=>g.date>=tdy&&!outcome(results[g.key]))||null;
}
function liveMinute(L,now=Date.now()){
  if(!L)return {h:1,min:1};
  if(L.st==="1H")return {h:1,min:Math.max(1,Math.floor((now-L.t1)/60000)+1)};
  if(L.st==="2H")return {h:2,min:HALF+Math.max(1,Math.floor((now-L.t2)/60000)+1)};
  if(L.st==="HT")return {h:1,min:HALF};
  if(L.st==="FT")return {h:2,min:2*HALF};
  return {h:1,min:1};
}
const minLabel=(h,m)=>{const cap=h===1?HALF:2*HALF;return m>cap?`${cap}+${m-cap}'`:`${m}'`};
const mmss=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`};
function clockText(L,now=Date.now()){
  if(!L||L.st==="pre")return null;
  if(L.st==="1H"){const el=now-L.t1;return {big:mmss(el),small:t("h1")+(el>HALF*60000?t("added"):"")}}
  if(L.st==="HT"){const left=BREAK*60000-(now-L.e1);return {big:mmss(left),small:left>0?t("brk"):t("brkOver")}}
  if(L.st==="2H"){const el=now-L.t2;return {big:mmss(HALF*60000+el),small:t("h2")+(el>HALF*60000?t("added"):"")}}
  return {big:t("ft"),small:t("ended")};
}
function derive(events){

  const m={};events.filter(e=>e.side==="us"&&e.name).forEach(e=>{m[e.name]=(m[e.name]||0)+1});

  return `<div class="h2h"><span class="slabel">🔁 ${t("h2h")}</span>${prev.map(p=>{const x=results[p.key];return `<span class="h2i"><span class="h2d">${fmt(p.date)} · ${p.comp==="cup"?t("cup"):t("league")}</span>${scoreHtml(p,x)}${resChip(outcome(x))}</span>`}).join("")}</div>`;
}

// ===== Calendar =====
const icsEsc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\;");
const icsD=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
const icsT=d=>`${icsD(d)}T${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}00`;
function venueText(g){const x=results[g.key]||{};if(x.venue)return x.venue;if(g.home)return LANG==="ar"?"ملعب الطيرة":HOME_VENUE;const tw=TOWN[g.o];return tw?(LANG==="ar"?tw[1]:tw[0]):""}
function calTimes(g){
  if(g.time){const [hh,mm]=g.time.split(":").map(Number);const s=new Date(g.date.getFullYear(),g.date.getMonth(),g.date.getDate(),hh,mm);return {s,e:new Date(s.getTime()+100*60000),allDay:false}}
  return {s:g.date,e:new Date(g.date.getFullYear(),g.date.getMonth(),g.date.getDate()+1),allDay:true};
}
const calTitle=g=>`⚽ ${g.home?t("team")+" – "+oName(g.o):oName(g.o)+" – "+t("team")}`;
const calDesc=g=>`${cardComp(g)} · ${g.home?t("home"):t("away")}\n${location.origin}/tira/`;
function icsEvent(g){
  const x=results[g.key]||{},c=calTimes(g),title=calTitle(g);
  const L=["BEGIN:VEVENT",`UID:tira-${g.key}@dibdrive.com`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"")}`];
  if(c.allDay)L.push(`DTSTART;VALUE=DATE:${icsD(c.s)}`,`DTEND;VALUE=DATE:${icsD(c.e)}`);else L.push(`DTSTART:${icsT(c.s)}`,`DTEND:${icsT(c.e)}`);
  L.push(`SUMMARY:${icsEsc(title)}`,`DESCRIPTION:${icsEsc(calDesc(g))}`);
  const v=venueText(g);if(v)L.push(`LOCATION:${icsEsc(v)}`);
  if(x.loc)L.push(`GEO:${x.loc.replace(",",";")}`);
  L.push("BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(title)}`,`TRIGGER:${c.allDay?"-PT15H":"-PT2H"}`,"END:VALARM","END:VEVENT");
  return L.join("\r\n");
}
function downloadIcs(games,name){
  const body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//dibdrive//tira//HE","CALSCALE:GREGORIAN","METHOD:PUBLISH",`X-WR-CALNAME:${icsEsc(t("team"))}`,...games.map(icsEvent),"END:VCALENDAR"].join("\r\n");
  const blob=new Blob([body],{type:"text/calendar;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
}
function gcalUrl(g){
  const c=calTimes(g),v=venueText(g);
  const dates=c.allDay?`${icsD(c.s)}/${icsD(c.e)}`:`${icsT(c.s)}/${icsT(c.e)}`;
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(calTitle(g))+"&dates="+dates+"&ctz=Asia/Jerusalem&details="+encodeURIComponent(calDesc(g))+(v?"&location="+encodeURIComponent(v):"");
}
function addToCal(k){const g=gameByKey(k);if(!g)return;if(NATIVE||/Android/i.test(navigator.userAgent))window.open(gcalUrl(g),"_blank","noopener");else downloadIcs([g],`tira-${iso(g.date)}.ics`)}
document.addEventListener("click",e=>{
  const c=e.target.closest&&e.target.closest("[data-ics]");if(c){addToCal(c.dataset.ics);return}
  if(e.target.closest&&e.target.closest("#icsAll")){const tdy=today();const gs=allGames().filter(g=>g.date>=tdy&&!outcome(results[g.key]));downloadIcs(gs.length?gs:allGames(),"tira-season.ics")}
});

// ===== Photo gallery =====
const galCache={};
async function loadGal(k){if(galCache[k])return galCache[k];if(!db)return [];const s=await db.collection("photos").where("game","==",DK(k)).get();const arr=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));galCache[k]=arr;return arr}
function galSlot(k,admin){const n=(results[k]||{}).photoCount||0;if(!n&&!admin)return "";return `<div class="gal" data-gal="${k}"${admin?' data-admin="1"':""}><div class="slabel">📷 ${t("photos")}${n?` · ${n}`:""}</div><div class="gthumbs">${n?`<span class="hint">${t("loading")}</span>`:""}</div>${admin?`<label class="btn sm gup">＋ הוסף תמונות<input type="file" accept="image/*" multiple hidden data-gup="${k}"></label> <span class="hint gst"></span>`:""}</div>`}
async function fillGals(){
  for(const el of document.querySelectorAll(".gal[data-gal]")){
    const k=el.dataset.gal,admin=el.dataset.admin==="1",box=el.querySelector(".gthumbs");
    if(!((results[k]||{}).photoCount)){box.innerHTML="";continue}
    try{const arr=await loadGal(k);box.innerHTML=arr.map((p,i)=>`<span class="gt"><button class="gimg" data-gk="${k}" data-gi="${i}" aria-label="${t("photo")} ${i+1}"><img src="${p.thumb}" alt="" loading="lazy"></button>${admin?`<button class="x gdel" data-gdel="${p.id}" data-gk="${k}" aria-label="מחק תמונה">×</button>`:""}</span>`).join("")}
    catch(e){box.innerHTML=`<span class="hint">${t("galErr")}</span>`}
  }
}
function resizeTo(img,max,q){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q)}
function fileImg(f){return new Promise((r,j)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{r(i);setTimeout(()=>URL.revokeObjectURL(u),2000)};i.onerror=()=>j(new Error("bad image"));i.src=u})}
async function setPhotoCount(k,n){const patch={photoCount:n};if(!results[k]&&k[0]==="r")patch.round=+k.slice(1);await db.doc("results/"+DK(k)).set(patch,{merge:true});results[k]={...(results[k]||{}),...patch}}
async function uploadPhotos(k,files,st){
  if(!db||!canEdit)return;let done=0,err="";
  for(const f of files){
    st.textContent=`מעלה ${done+1} מתוך ${files.length}…`;
    try{
      const img=await fileImg(f);let mx=1600,q=.8,full=resizeTo(img,mx,q);
      while(full.length>900000){q-=.1;if(q<.45){mx=Math.round(mx*.8);q=.75}full=resizeTo(img,mx,q)}
      const thumb=resizeTo(img,360,.7),id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await db.doc("photoFull/"+id).set({game:DK(k),data:full});
      await db.doc("photos/"+id).set({game:DK(k),thumb,ts:Date.now()});
      done++;
    }catch(e){err=e.code||e.message||"";console.error(e)}
  }
  if(done)await setPhotoCount(k,((results[k]||{}).photoCount||0)+done);
  delete galCache[k];
  st.textContent=err?`העלאה נכשלה (${err})${done?` – הועלו ${done}`:""}`:`✓ הועלו ${done} תמונות`;
  document.querySelectorAll(`.gal[data-gal="${k}"] > .slabel`).forEach(s=>s.textContent=`📷 ${t("photos")} · ${(results[k]||{}).photoCount||0}`);
  fillGals();
}
async function delPhoto(k,id){
  if(!db||!canEdit)return;
  try{await db.doc("photos/"+id).delete();await db.doc("photoFull/"+id).delete();await setPhotoCount(k,Math.max(0,((results[k]||{}).photoCount||1)-1))}catch(e){console.error(e)}
  delete galCache[k];
  document.querySelectorAll(`.gal[data-gal="${k}"] > .slabel`).forEach(s=>s.textContent=`📷 ${t("photos")} · ${(results[k]||{}).photoCount||0}`);
  fillGals();
}
const gdlg=document.getElementById("gdlg");let gview=null;
async function showPhoto(k,i){
  const arr=galCache[k]||[];if(!arr[i])return;gview={k,i};
  gdlg.innerHTML=`<div class="gbox"><img id="gfull" src="${arr[i].thumb}" alt=""><div class="gnav"><button class="btn sm" data-gnav="-1"${i?"":" disabled"} aria-label="הקודמת">›</button><span dir="ltr">${i+1} / ${arr.length}</span><button class="btn sm" data-gnav="1"${i<arr.length-1?"":" disabled"} aria-label="הבאה">‹</button><button class="btn sm" data-gclose aria-label="${t("close")}">✕</button></div></div>`;
  if(!gdlg.open)gdlg.showModal();
  try{const d=await db.doc("photoFull/"+arr[i].id).get();if(gview&&gview.k===k&&gview.i===i&&d.exists){const im=document.getElementById("gfull");if(im)im.src=d.data().data}}catch(e){}
}
gdlg.addEventListener("click",e=>{if(e.target===gdlg||e.target.closest("[data-gclose]")){gdlg.close();gview=null;return}const n=e.target.closest("[data-gnav]");if(n&&gview)showPhoto(gview.k,gview.i+ +n.dataset.gnav)});
document.addEventListener("click",e=>{
  const gi=e.target.closest&&e.target.closest("[data-gi]");if(gi){showPhoto(gi.dataset.gk,+gi.dataset.gi);return}
  const gd=e.target.closest&&e.target.closest("[data-gdel]");if(gd){if(gd.dataset.armed!=="1"){gd.dataset.armed="1";gd.textContent="מחק?";gd.classList.add("armed");return}gd.disabled=true;delPhoto(gd.dataset.gk,gd.dataset.gdel)}
});
document.addEventListener("change",e=>{const inp=e.target.closest&&e.target.closest("input[data-gup]");if(!inp||!inp.files||!inp.files.length)return;const st=inp.closest(".gal").querySelector(".gst");uploadPhotos(inp.dataset.gup,[...inp.files],st);inp.value=""});
